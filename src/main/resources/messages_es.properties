# PARA NOSOTROS

nosotros.titulo=Sobre Nosotros
nosotros.historia.titulo=Nuestra Historia
nosotros.historia.descripcion=Comopapobre nació a inicios del 2020 como un pequeño restaurante con una idea clara: ofrecer comida rápida, sabrosa y accesible para todos. Empezamos con mucho esfuerzo, en un espacio modesto y con recetas caseras que conquistaban paladares desde el primer bocado.\n\nPoco a poco, gracias al cariño de nuestros primeros clientes y al poder de las redes sociales —sobre todo TikTok—, nuestra propuesta comenzó a hacerse conocida.\n\nHoy, Comopapobre no solo sigue creciendo, sino que también lleva sus sabores a cada rincón de Ventanilla con su servicio de delivery. Nos mantenemos fieles a nuestra esencia: comida rápida, porciones generosas y precios accesibles para todos.
nosotros.mision.titulo=Misión
nosotros.mision.descripcion=Ofrecer comida rápida, rica y accesible para todos, con porciones generosas y sabor casero.
nosotros.vision.titulo=Visión
nosotros.vision.descripcion=Ser la opción favorita de comida rápida en Ventanilla y seguir creciendo con cercanía y sabor.
nosotros.valores.titulo=Nuestros Valores
nosotros.valores.cercania=Cercanía
nosotros.valores.cercania.descripcion=Tratamos a cada cliente como en casa, con atención cálida y auténtica.
nosotros.valores.calidad=Calidad
nosotros.valores.calidad.descripcion=Ofrecemos buena comida sin que tengas que pagar de más.
nosotros.valores.esfuerzo=Esfuerzo
nosotros.valores.esfuerzo.descripcion=Crecemos con trabajo diario y pasión por lo que hacemos.
