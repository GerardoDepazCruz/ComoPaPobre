<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8" />
    <title th:text="${#messages.msg('titulo.sugerencias')} + ' - ComoPaPobre'">Sugerencias - ComoPaPobre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link rel="icon" th:href="@{/img/logoComoPaPobre.ico}" type="image/x-icon" />
</head>

<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 th:text="${#messages.msg('titulo.sugerencias')} + ' - ComoPaPobre'">Sugerencias - ComoPaPobre</h2>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th th:text="${#messages.msg('tabla.nombre')}">Nombre</th>
                            <th th:text="${#messages.msg('tabla.email')}">Email</th>
                            <th th:text="${#messages.msg('tabla.descripcion')}">Descripción</th>
                            <th th:text="${#messages.msg('tabla.fechaCreacion')}">Fecha de Creación</th>
                            <th th:text="${#messages.msg('tabla.acciones')}">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="sugerencia : ${sugerencias}" th:attr="data-id=${sugerencia.id}">
                            <td>
                                <input type="text" class="form-control" th:value="${sugerencia.nombre}"
                                    th:attr="data-id=${sugerencia.id}, data-field='nombre'" />
                            </td>
                            <td>
                                <input type="email" class="form-control" th:value="${sugerencia.email}"
                                    th:attr="data-id=${sugerencia.id}, data-field='email'" />
                            </td>
                            <td>
                                <textarea class="form-control" rows="2" th:text="${sugerencia.descripcion}"
                                    th:attr="data-id=${sugerencia.id}, data-field='descripcion'"></textarea>
                            </td>
                            <td>
                                <span
                                    th:text="${#dates.format(sugerencia.fechaCreacion, 'dd/MM/yyyy HH:mm')}">01/01/2023
                                    12:00</span>
                            </td>
                            <td>
                                <div class="btn-group">
                                    <button type="button" class="btn btn-danger btn-sm"
                                        th:onclick="'eliminarSugerencia(' + ${sugerencia.id} + ')'"
                                        th:title="#{boton.eliminar}">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${sugerencias == null or #lists.isEmpty(sugerencias)}">
                            <td colspan="5" class="text-center" th:text="#{mensaje.noSugerencias}">No hay sugerencias
                                disponibles.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function guardarCambios(button) {
            const row = button.closest('tr');
            const inputs = row.querySelectorAll('input, textarea');
            const sugerencia = {
                id: inputs[0].dataset.id,
                nombre: inputs[0].value,
                email: inputs[1].value,
                descripcion: inputs[2].value
            };

            fetch('/sugerencias/actualizar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(sugerencia)
            })
                .then(response => {
                    if (response.ok) {
                        alert('Sugerencia actualizada correctamente');
                        location.reload();
                    } else {
                        alert('Error al actualizar la sugerencia');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error al actualizar la sugerencia');
                });
        }

        function eliminarSugerencia(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar esta sugerencia?')) {
                return;
            }

            fetch(`/sugerencias/eliminar/${id}`, {
                method: 'DELETE',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error al eliminar la sugerencia');
                    }
                    // Eliminar la fila de la tabla
                    const fila = document.querySelector(`tr[data-id='${id}']`);
                    if (fila) {
                        fila.remove();
                    }
                    alert('Sugerencia eliminada correctamente');
                })
                .catch(error => {
                    alert(error.message);
                });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
