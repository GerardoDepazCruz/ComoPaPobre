<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Promociones | Como Pa Pobre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" th:href="@{/css/crearcuenta.css}">
    <link rel="icon" th:href="@{/img/logoComoPaPobre.ico}" type="image/x-icon">
</head>

<body>
    <!-- Navbar -->
    <nav th:replace="~{components/navbar :: nav-bar}"></nav>

    <!-- Formulario para crear cuenta -->
    <section class="registro-section py-5" style="margin-top: 120px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-lg p-4 border-0 rounded-4">
                        <h3 class="text-center mb-4" style="font-family: 'Righteous', cursive; color: #FFCA1A;"
                            th:text="#{registro.titulo}">Crear Cuenta</h3>

                        <!-- Mensaje de Error cuando se repita el usuario o el correo -->
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <p th:text="${error}"></p>
                        </div>


                        <form method="post" th:action="@{/registro}">
                            <div class="mb-3">
                                <label for="nombre" class="form-label" th:text="#{registro.nombre}">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" th:value="${nombre}"
                                    th:placeholder="#{registro.placeholder.nombre}" required pattern="^[A-Za-zÀ-ÿ\s]+$"
                                    title="El nombre solo debe contener letras y espacios (sin números ni símbolos)">
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label" th:text="#{registro.correo}">Correo</label>
                                <input type="email" class="form-control" id="correo" name="correo" th:value="${correo}"
                                    th:placeholder="#{registro.placeholder.correo}" required
                                    pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$"
                                    title="El correo debe ser válido y debe terminar en @gmail.com">
                            </div>

                            <div class="mb-3">
                                <label for="username" class="form-label" th:text="#{registro.usuario}">Usuario</label>
                                <input type="text" class="form-control" id="username" name="username"
                                    th:value="${username}" th:placeholder="#{registro.placeholder.usuario}" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label"
                                    th:text="#{registro.contrasena}">Contraseña</label>
                                <input type="password" class="form-control" id="password" name="password"
                                    th:placeholder="#{registro.placeholder.contrasena}" required
                                    pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"
                                    title="La contraseña debe tener al menos 8 caracteres y tambien letras para mayor seguridad">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark" th:text="#{registro.boton}">Crear
                                    Cuenta</button>
                            </div>
                            <div class="text-center mt-3">
                                <span th:text="#{registro.yaCuenta}">¿Ya tienes una cuenta?</span>
                                <a href="/login" class="text-decoration-none" style="color: #FF5733;"
                                    th:text="#{registro.iniciaSesion}">Inicia sesión</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div th:replace="~{components/footer :: footer}"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/inicio.js}"></script>
    <script th:src="@{/js/carrito.js}"></script>
    <script th:src="@{/js/inactividad.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
