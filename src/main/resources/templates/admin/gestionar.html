<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de Administración | Como Pa Pobre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" th:href="@{/css/crearcuenta.css}">
    <link rel="icon" th:href="@{/img/logoComoPaPobre.ico}" type="image/x-icon">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark fixed-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <!-- LOGO Y NOMBRE A LA IZQUIERDA -->
            <a class="navbar-brand">
                <img th:src="@{/img/logoComoPaPobre.png}" alt="Logo" width="60" height="60"
                    class="d-inline-block align-text-top">
                <span th:text="#{navbar.nombre}">Como Pa Pobre</span>
            </a>

            <!-- SECCIÓN DERECHA: IDIOMAS + CARRITO + BOTÓN MENÚ -->
            <div class="d-flex align-items-center ms-auto">

                <!-- Idiomas -->
                <div class="me-3">
                    <a href="?lang=es" class="text-white me-2" th:text="#{navbar.espanol}">Español</a>
                    <a href="?lang=en" class="text-white" th:text="#{navbar.ingles}">English</a>
                </div>
            </div>

            <!-- CERRAR SESION -->
                
                <form th:action="@{/admin/logout}" method="post">
    <button type="submit" class="btn btn-danger">Cerrar sesión</button>
</form>

        </div>
    </nav>

    <section class="py-5 flex-grow-1" style="margin-top: 120px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-lg p-4 border-0 rounded-4">
                        <h1 class="text-center mb-4" style="font-family: 'Righteous', cursive; color: #FFCA1A;"
                            th:text="#{bienvenido.admin}">Bienvenido, Administrador</h1>
                        <p class="text-center" th:text="#{pagina.gestion.admin}">Esta es la página de gestión.</p>
                    <div class="d-flex justify-content-center gap-4 mt-4">
                        <a href="/admin/sugerencias/lista" class="btn btn-warning btn-lg shadow rounded-3" style="width: 180px; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold;" 
                        th:text="#{btn.sugerencia.admin}" >Lista de Sugerencias</a>
                        <a href="/admin/reclamaciones/lista" class="btn btn-warning btn-lg shadow rounded-3" style="width: 180px; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold;"
                        th:text="#{btn.reclamo.admin}" >Lista de Reclamos</a>
                        <a href="/admin/menu/listahambur" class="btn btn-warning btn-lg shadow rounded-3" style="width: 180px; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold;"
                        th:text="#{btn.menu.admin}" >Lista del Menú</a>
                    </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/inicio.js}"></script>
    <script src="/js/inactividad-admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
