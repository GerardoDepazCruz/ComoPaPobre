<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Administrador | Como Pa Pobre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" th:href="@{/css/crearcuenta.css}">
</head>
<body>

    <nav class="navbar navbar-dark fixed-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <!-- LOGO Y NOMBRE A LA IZQUIERDA -->
            <a class="navbar-brand">
                <img th:src="@{/img/logoComoPaPobre.png}" alt="Logo" width="60" height="60"
                    class="d-inline-block align-text-top">
                <span th:text="#{navbar.nombre}">Como Pa Pobre</span>
            </a>

            <!-- SECCIÓN DERECHA: IDIOMAS + CARRITO + BOTÓN MENÚ -->
            <div class="d-flex align-items-center ms-auto">

                <!-- Idiomas -->
                <div class="me-3">
                    <a href="?lang=es" class="text-white me-2" th:text="#{navbar.espanol}">Español</a>
                    <a href="?lang=en" class="text-white" th:text="#{navbar.ingles}">English</a>
                </div>
            </div>
        </div>

        </div>
    </nav>

    <section class="registro-section py-5" style="margin-top: 120px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-lg p-4 border-0 rounded-4 d-flex flex-column justify-content-center"
                        style="min-height: 550px;">


                        <h3 class="text-center mb-4" style="font-family: 'Righteous', cursive; color: #000000;"
                            th:text="#{login.admin}">
                            Login Administrador</h3>
                        <form th:action="@{/admin/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label"
                                    th:text="#{registro.nombre.admin}">Usuario:</label>
                                <input type="text" class="form-control" id="username" name="username" required />
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label"
                                    th:text="#{registro.contraseña.admin}">Contraseña:</label>
                                <input type="password" class="form-control" id="password" name="password" required />
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark" th:text="#{enviar.admin}">Ingresar</button>
                            </div>

                            <div th:if="${param.error}" class="text-center mt-3">
                                <p style="color:red;">Usuario o contraseña incorrectos.</p>
                            </div>
                            <div th:if="${param.logout}" class="text-center mt-3">
                                <p style="color:green;">Has cerrado sesión correctamente.</p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/inicio.js}"></script>
    <script th:src="@{/js/carrito.js}"></script>
    <script src="/js/inactividad-admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
