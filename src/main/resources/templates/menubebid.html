<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Bebida | Como Pa Pobre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
    <link rel="icon" th:href="@{/img/logoComoPaPobre.ico}" type="image/x-icon">
    <!-- Inyección de la variable global isAuthenticated -->
    <script th:inline="javascript">
        var isAuthenticated = /*[[${#authorization.expression('isAuthenticated()')}]]*/ false;
        console.log("isAuthenticated:", isAuthenticated);
    </script>
    
</head>
<body>
    <!-- Navbar -->
    <nav th:replace="~{components/navbar :: nav-bar}"></nav>

    <!-- Sección de Menu Bebida -->
    <div class="container">
        <section class="prod-section">
            <h2 class="text-center prod-title" th:text="#{titulo.menubebida}">MENU DE BEBIDA</h2>
            <div class="row g-4">
            
                <!-- Bebida 1 -->
                <div class="col-lg-3 col-md-6">
                    <div class="prod-card h-100">
                        <div class="prod-img-container">
                            <img th:src="@{/img/bebida1.jpg}" class="bebida-img" alt="Coca Cola 1L">
                        </div>
                        <div class="prod-body">
                            <h3 th:text="#{titulo.bebida1}">Coca Cola 1L</h3>
                            <div class="prod-price">
                                <span class="discounted-price">S/ 6.00</span>
                            </div>
                            <button class="btn btn-prod" th:text="#{pedir.ahora}">Pedir ahora</button>
                        </div>
                    </div>
                </div>

                <!-- Bebida 2 -->
                <div class="col-lg-3 col-md-6">
                    <div class="prod-card h-100">
                        <div class="prod-img-container">
                            <img th:src="@{/img/bebida2.jpg}" class="bebida-img" alt="Inka Cola 1L">
                        </div>
                        <div class="prod-body">
                            <h3 th:text="#{titulo.bebida2}">Inka Cola 1L</h3>
                            <div class="prod-price">
                                <span class="discounted-price">S/ 6.00</span>
                            </div>
                            <button class="btn btn-prod" th:text="#{pedir.ahora}">Pedir ahora</button>
                        </div>
                    </div>
                </div>

                <!-- Bebida 3 -->
                <div class="col-lg-3 col-md-6">
                    <div class="prod-card h-100">
                        <div class="prod-img-container">
                            <img th:src="@{/img/bebida3.png}" class="bebida-img" alt="Refresco de Maracuyá 1L">
                        </div>
                        <div class="prod-body">
                            <h3 th:text="#{titulo.bebida3}">Refresco de Maracuyá 1L</h3>
                            <div class="prod-price">
                                <span class="discounted-price">S/ 9.00</span>
                            </div>
                            <button class="btn btn-prod" th:text="#{pedir.ahora}">Pedir ahora</button>
                        </div>
                    </div>
                </div>
                
                <!-- Bebida 4 -->
                <div class="col-lg-3 col-md-6">
                    <div class="prod-card h-100">
                        <div class="prod-img-container">
                            <img th:src="@{/img/bebida4.jpg}" class="bebida-img" alt="Chicha Morada 1L">
                        </div>
                        <div class="prod-body">
                            <h3 th:text="#{titulo.bebida4}">Chicha Morada 1L</h3>
                            <div class="prod-price">
                                <span class="discounted-price">S/ 9.00</span>
                            </div>
                            <button class="btn btn-prod" th:text="#{pedir.ahora}">Pedir ahora</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    
    <!-- Footer -->
    <div th:replace="~{components/footer :: footer}"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/inicio.js}"></script>
    <script th:src="@{/js/carrito.js}"></script>
    <script th:src="@{/js/inactividad.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
