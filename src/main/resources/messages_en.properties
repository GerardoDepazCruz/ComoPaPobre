# PARA NOSOTROS

nosotros.titulo=About Us
nosotros.historia.titulo=Our History
nosotros.historia.descripcion=Comopapobre was founded in early 2020 as a small restaurant with a clear idea: to offer fast, tasty, and affordable food for everyone. We started with a lot of effort, in a modest space, with homemade recipes that won over taste buds from the very first bite.\n\nLittle by little, thanks to the affection of our first customers and the power of social media —especially TikTok—, our proposal started to become well-known.\n\nToday, Comopapobre continues to grow, and it also brings its flavors to every corner of Ventanilla with its delivery service. We remain true to our essence: fast food, generous portions, and affordable prices for everyone.
nosotros.mision.titulo=Mission
nosotros.mision.descripcion=To offer fast, delicious, and accessible food for everyone, with generous portions and homemade flavor.
nosotros.vision.titulo=Vision
nosotros.vision.descripcion=To be the favorite fast food option in Ventanilla and continue growing with closeness and flavor.
